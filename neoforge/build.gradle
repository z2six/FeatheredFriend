// neoforge/build.gradle

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

def depMinecraftVersion = (project.findProperty('dep_minecraft_version') ?: minecraft_version).toString()
def jeiMinecraftVersion = (project.findProperty('jei_minecraft_version') ?: depMinecraftVersion).toString()
def geckolibMinecraftVersion = (project.findProperty('geckolib_minecraft_version') ?: depMinecraftVersion).toString()
def resolvedJeiVersion = (project.findProperty('jei_version') ?: '19.25.1.328').toString()
def jeiRuntimeEnabledProp = project.findProperty('jei_runtime_enabled')?.toString()
def jeiRuntimeEnabled = (jeiRuntimeEnabledProp == null) ? true : jeiRuntimeEnabledProp.toBoolean()
def resolvedJadeVersion = (project.findProperty('jade_version') ?: '15.10.5+neoforge').toString()

repositories {
    // GeckoLib's official Cloudsmith Maven repository (required to resolve GeckoLib artifacts)
    // Restrict scope to the GeckoLib group to avoid affecting other dependency resolution.
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    // Jade is hosted on Modrinth Maven.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup("maven.modrinth")
        }
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        client2 {
            client()
            // Second client for local multiplayer testing.
            // Uses a separate game directory to avoid save/config/log contention with the primary client.
            gameDirectory.set(file('run/client2'))
            programArguments.addAll '--username', 'Dev2'
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // JEI API for compile-time, JEI mod for runtime
    compileOnly "mezz.jei:jei-${jeiMinecraftVersion}-neoforge-api:${resolvedJeiVersion}"
    if (jeiRuntimeEnabled) {
        runtimeOnly "mezz.jei:jei-${jeiMinecraftVersion}-neoforge:${resolvedJeiVersion}"
    }

    // GeckoLib (NeoForge 1.21.x; artifact suffix can be overridden per matrix entry)
    implementation "software.bernie.geckolib:geckolib-neoforge-${geckolibMinecraftVersion}:${geckolib_version}"

    // Jade (optional integration)
    // Compile-time API is needed for FeatheredFriendJadePlugin to compile, but the mod remains optional at runtime.
    compileOnly "maven.modrinth:jade:${resolvedJadeVersion}"
    runtimeOnly  "maven.modrinth:jade:${resolvedJadeVersion}"

    // Optional integration APIs (resolved from local dev run/mods jars).
    // Keep these in run/mods for compilation if you prefer local jars:
    //  - curios-neoforge-*.jar
    compileOnly fileTree(dir: 'run/mods', include: ['curios-neoforge-*.jar'])
}

// Groovy Gradle syntax
tasks.withType(JavaCompile).configureEach {
    // Show where all the "unchecked" warnings come from
    options.compilerArgs += ["-Xlint:unchecked"]
    // (Optional, often handy too)
    // options.compilerArgs += ["-Xlint:deprecation"]
}

def compileOutputSuffix = project.findProperty('ff_compile_output_suffix')?.toString()
if (compileOutputSuffix) {
    tasks.withType(JavaCompile).configureEach {
        destinationDirectory.set(layout.buildDirectory.dir("classes/java/${name}-${compileOutputSuffix}"))
    }
}

// NeoForge 1.21.x matrix profiles used by Gradle panel tasks below.
// 1.21.3 has no JEI NeoForge runtime artifact. Keep API available for compile, but skip JEI runtime there.
def neo121Profiles = [
    [id: "1_21_0",  mc: "1.21",    neoforge: "21.0.167", neoform: "1.21-20240613.152323",    jei: "19.8.2.99",  gecko: "4.5.8",       jade: "15.10.5+neoforge"],
    [id: "1_21_1",  mc: "1.21.1",  neoforge: "21.1.219", neoform: "1.21.1-20240808.144430",  jei: "19.9.1.125", gecko: "4.8.3",       jade: "15.10.5+neoforge"],
    [id: "1_21_3",  mc: "1.21.3",  neoforge: "21.3.95",  neoform: "1.21.3-20241023.131943",  jei: "19.9.1.125", jeiMc: "1.21.1", jeiRuntime: false, gecko: "4.7.3", jade: "16.0.4+neoforge"],
    [id: "1_21_4",  mc: "1.21.4",  neoforge: "21.4.156", neoform: "1.21.4-20241203.161809",  jei: "20.0.0.4",   gecko: "4.8.5",       jade: "17.2.2+neoforge"],
    [id: "1_21_5",  mc: "1.21.5",  neoforge: "21.5.96",  neoform: "1.21.5-20250325.162830",  jei: "21.4.0.27",  gecko: "5.1.0",       jade: "18.0.0+neoforge"],
    [id: "1_21_8",  mc: "1.21.8",  neoforge: "21.8.52",  neoform: "1.21.8-20250717.133445",  jei: "24.2.0.6",   gecko: "5.2.2",       jade: "19.0.3+neoforge"],
    [id: "1_21_10", mc: "1.21.10", neoforge: "21.10.64", neoform: "1.21.10-20251010.172816", jei: "26.2.0.30",  gecko: "5.3-alpha-3", jade: "20.0.5+neoforge"]
]

def legacyProfileIds = ["1_21_0", "1_21_1", "1_21_3"]
def modernProfileIds = ["1_21_4", "1_21_5", "1_21_8", "1_21_10"]

def matrixProps = { profile ->
    def props = [
        "skip_fabric": "true",
        "skip_forge": "true",
        "minecraft_version": profile.mc,
        "neoforge_version": profile.neoforge,
        "neo_form_version": profile.neoform,
        "dep_minecraft_version": profile.mc,
        "jei_minecraft_version": (profile.jeiMc ?: profile.mc),
        "jei_runtime_enabled": ((profile.jeiRuntime == null) ? true : profile.jeiRuntime).toString(),
        "geckolib_minecraft_version": profile.mc,
        "jei_version": profile.jei,
        "geckolib_version": profile.gecko,
        "jade_version": (profile.jade ?: "15.10.5+neoforge")
    ]
    if (compileOutputSuffix) {
        props["ff_compile_output_suffix"] = compileOutputSuffix
    }
    props
}

def isWindowsOs = System.getProperty("os.name").toLowerCase().contains("windows")
def gradleCommandPrefix = isWindowsOs ? ["cmd", "/c", "gradlew.bat"] : ["./gradlew"]
def localGradleUserHome = new File(rootProject.projectDir, ".gradle-user-home").absolutePath

def registerMatrixExecTask = { String taskName, String groupName, String descriptionText, List<String> gradleTasks, Map<String, String> props ->
    tasks.register(taskName, Exec) {
        group = groupName
        description = descriptionText
        workingDir rootProject.projectDir
        environment "GRADLE_USER_HOME", localGradleUserHome

        def argsList = []
        argsList.addAll(gradleCommandPrefix)
        argsList.addAll(gradleTasks)
        argsList += "--no-daemon"
        argsList += "--configure-on-demand"
        props.each { key, value ->
            argsList += "-P${key}=${value}"
        }
        commandLine argsList
    }
}

def buildTaskNames = []
def runClientTaskNames = []
def runClient2TaskNames = []

neo121Profiles.each { profile ->
    def versionLabel = profile.mc
    def buildTaskName = "buildNeo_${profile.id}"
    def runClientTaskName = "runClientNeo_${profile.id}"
    def runClient2TaskName = "runClient2Neo_${profile.id}"

    registerMatrixExecTask(
        buildTaskName,
        "build",
        "Builds NeoForge for Minecraft ${versionLabel} using matrix profile settings.",
        [":common:compileJava", ":neoforge:build"],
        matrixProps(profile)
    )

    registerMatrixExecTask(
        runClientTaskName,
        "mod development",
        "Runs NeoForge client for Minecraft ${versionLabel} using matrix profile settings.",
        [":neoforge:runClient"],
        matrixProps(profile)
    )

    registerMatrixExecTask(
        runClient2TaskName,
        "mod development",
        "Runs NeoForge second client for Minecraft ${versionLabel} using matrix profile settings.",
        [":neoforge:runClient2"],
        matrixProps(profile)
    )

    buildTaskNames << buildTaskName
    runClientTaskNames << runClientTaskName
    runClient2TaskNames << runClient2TaskName
}

for (int i = 1; i < buildTaskNames.size(); i++) {
    tasks.named(buildTaskNames[i]) {
        mustRunAfter(buildTaskNames[i - 1])
    }
}

def legacyBuildTaskNames = neo121Profiles
    .findAll { legacyProfileIds.contains(it.id) }
    .collect { "buildNeo_${it.id}" }
def modernBuildTaskNames = neo121Profiles
    .findAll { modernProfileIds.contains(it.id) }
    .collect { "buildNeo_${it.id}" }

tasks.register("buildNeo_legacyBand") {
    group = "build"
    description = "Builds all legacy-band NeoForge profiles (1.21 to 1.21.3)."
    dependsOn(legacyBuildTaskNames)
}

tasks.register("buildNeo_modernBand") {
    group = "build"
    description = "Builds all modern-band NeoForge profiles (1.21.4+)."
    dependsOn(modernBuildTaskNames)
}

tasks.register("buildNeo_allBand") {
    group = "build"
    description = "Builds all configured NeoForge 1.21.x profiles."
    dependsOn(buildTaskNames)
}
