// neoforge/build.gradle

plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    // GeckoLib's official Cloudsmith Maven repository (required to resolve GeckoLib artifacts)
    // Restrict scope to the GeckoLib group to avoid affecting other dependency resolution.
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        client2 {
            client()
            // Second client for local multiplayer testing.
            // Uses a separate game directory to avoid save/config/log contention with the primary client.
            gameDirectory.set(file('run/client2'))
            programArguments.addAll '--username', 'Dev2'
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    // JEI API for compile-time, JEI mod for runtime
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.25.1.328"
    runtimeOnly  "mezz.jei:jei-1.21.1-neoforge:19.25.1.328"

    // GeckoLib (NeoForge 1.21.1)
    implementation "software.bernie.geckolib:geckolib-neoforge-1.21.1:4.8.2"

    // Optional integration APIs (resolved from local dev run/mods jars).
    // Keep these in run/mods for compilation:
    //  - Jade-*.jar
    //  - curios-neoforge-*.jar
    compileOnly fileTree(dir: 'run/mods', include: ['Jade-*.jar', 'curios-neoforge-*.jar'])
}

// Groovy Gradle syntax
tasks.withType(JavaCompile).configureEach {
    // Show where all the "unchecked" warnings come from
    options.compilerArgs += ["-Xlint:unchecked"]
    // (Optional, often handy too)
    // options.compilerArgs += ["-Xlint:deprecation"]
}
